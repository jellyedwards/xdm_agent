steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/xdm-agent/xdm-agent:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/xdm-agent/xdm-agent:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - xdm-agent
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/xdm-agent/xdm-agent:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --timeout=300
      - --concurrency=20
      - --min-instances=0
      - --max-instances=${_MAX_INSTANCES}
      - --set-env-vars=STORAGE_BACKEND=firestore,GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},PUBLIC_MODE=1,AGENT_CLIENT_ID=xdm_agent_v1,QUOTA_DAILY_HUNTS=20,QUOTA_DAILY_MINDSETS=20,QUOTA_DAILY_GLOBAL=${_QUOTA_DAILY_GLOBAL},XDM_SERVER_URL=${_XDM_SERVER_URL}
      - --set-secrets=UNSPLASH_ACCESS_KEY=unsplash-access-key:latest,PEXELS_API_KEY=pexels-api-key:latest,PIXABAY_API_KEY=pixabay-api-key:latest,GOOGLE_CSE_API_KEY=google-cse-api-key:latest,GOOGLE_CSE_CX=google-cse-cx:latest,SERPAPI_API_KEY=serpapi-api-key:latest,A2A_SHARED_SECRET=a2a-shared-secret:latest,JUDGE_ACCESS_CODES=judge-access-codes:latest,FIREBASE_SERVICE_ACCOUNT=firebase-service-account:latest,AGENT_CLIENT_SECRET=agent-client-secret:latest

# Secrets expected in Secret Manager (create once: gcloud secrets create <name> --data-file=-):
#   unsplash-access-key, pexels-api-key, pixabay-api-key, google-cse-api-key,
#   google-cse-cx, serpapi-api-key, a2a-shared-secret,
#   judge-access-codes        comma-separated codes, e.g. "GFS-JUDGE-2026"
#   firebase-service-account  base64 of the design-xdm service-account JSON
#   agent-client-secret       shared HMAC secret; matches xdm_server AGENT_CLIENT_SECRETS
# Gemini runs through Vertex (GOOGLE_GENAI_USE_VERTEXAI=true) — no API key needed.
# --max-instances is the cost ceiling; QUOTA_DAILY_GLOBAL is the wallet backstop.

substitutions:
  _REGION: europe-west2
  _MAX_INSTANCES: "3"
  _QUOTA_DAILY_GLOBAL: "600"
  _XDM_SERVER_URL: ""   # set to the design xdm server origin to enable publish-to-moodboard

options:
  logging: CLOUD_LOGGING_ONLY
